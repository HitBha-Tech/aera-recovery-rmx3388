name: Build AERA Recovery for RMX3388

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'device/realme/RMX3388/**'
      - '.github/workflows/build_aera.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: rm
        shell: bash 
        run: rm -rf out/target/product/RMX3388/recovery out/target/product/RMX3388/obj/PACKAGING/recovery_intermediates

      - name: Build recovery image
        shell: bash
        run: |
          cd "$RUNNER_TEMP/aosp"
          export AERA_BUILD_DEVICE=RMX3388
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_RMX3388-bp2a-eng
          m -j1 adbd recoveryimage

      - name: Check recovery image and calculate hash
        run: |
          image="$RUNNER_TEMP/aosp/out/target/product/RMX3388/recovery.img"
          test -s "$image"
          size=$(stat -c '%s' "$image")
          test "$size" -le 134217728
          sha256sum "$image" | tee "$RUNNER_TEMP/recovery.sha256"
          echo "Recovery image size: $size bytes"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-RMX3388-recovery-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/aosp/out/target/product/RMX3388/recovery.img
            ${{ runner.temp }}/recovery.sha256
          retention-days: 90

      - name: Publish recovery release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="aera-rmx3388-${GITHUB_RUN_ID}"
          image="$RUNNER_TEMP/aosp/out/target/product/RMX3388/recovery.img"
          gh release create "$tag" "$image" \
            --title "AERA Recovery for RMX3388 (build ${GITHUB_RUN_NUMBER})" \
            --notes "AERA Android 16 recovery build for Realme RMX3388. SHA-256 is available in the workflow artifact."
