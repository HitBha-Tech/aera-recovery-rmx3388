name: Build AERA Recovery for RMX3388

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'device/realme/RMX3388/**'
      - '.github/workflows/build_aera.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod a+rx "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync AERA Android 16 source
        run: |
          mkdir -p "$RUNNER_TEMP/aosp"
          cd "$RUNNER_TEMP/aosp"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/aera-build.xml <<'XML'
          <manifest>
            <remove-project name="android_cts" />
          </manifest>
          XML
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Add RMX3388 device tree
        run: |
          mkdir -p "$RUNNER_TEMP/aosp/device/realme"
          cp -a "$GITHUB_WORKSPACE/device/realme/RMX3388" "$RUNNER_TEMP/aosp/device/realme/"

      - name: Ensure build swap
        run: |
          current_swap_kb=$(awk 'NR > 1 { total += $3 } END { print total + 0 }' /proc/swaps)
          if [ "$current_swap_kb" -lt 8388608 ]; then
            sudo fallocate -l 8G "$RUNNER_TEMP/aera-build.swap"
            sudo chmod 600 "$RUNNER_TEMP/aera-build.swap"
            sudo mkswap "$RUNNER_TEMP/aera-build.swap"
            sudo swapon "$RUNNER_TEMP/aera-build.swap"
          fi
          free -h
          swapon --show

      - name: Build recovery image
        shell: bash
        run: |
          cd "$RUNNER_TEMP/aosp"
          export AERA_BUILD_DEVICE=RMX3388
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_RMX3388-bp2a-eng
          m -j1 adbd recoveryimage

      - name: Check recovery image and calculate hash
        run: |
          image="$RUNNER_TEMP/aosp/out/target/product/RMX3388/recovery.img"
          test -s "$image"
          size=$(stat -c '%s' "$image")
          test "$size" -le 134217728
          sha256sum "$image" | tee "$RUNNER_TEMP/recovery.sha256"
          echo "Recovery image size: $size bytes"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-RMX3388-recovery-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/aosp/out/target/product/RMX3388/recovery.img
            ${{ runner.temp }}/recovery.sha256
          retention-days: 90

      - name: Publish recovery release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="aera-rmx3388-${GITHUB_RUN_ID}"
          image="$RUNNER_TEMP/aosp/out/target/product/RMX3388/recovery.img"
          gh release create "$tag" "$image" \
            --title "AERA Recovery for RMX3388 (build ${GITHUB_RUN_NUMBER})" \
            --notes "AERA Android 16 recovery build for Realme RMX3388. SHA-256 is available in the workflow artifact."
