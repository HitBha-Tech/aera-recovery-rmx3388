name: Build AERA Recovery (RMX3388)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'AERA Manifest URL'
        required: true
        default: 'https://github.com/AERA-Recovery/android_manifest.git'
      MANIFEST_BRANCH:
        description: 'AERA Manifest Branch'
        required: true
        default: 'aera-16.0' # Change from 'main' to a valid branch like aera-16.0
      DEVICE_VENDOR:
        description: 'Device Vendor'
        required: true
        default: 'realme'
      DEVICE_CODE:
        description: 'Device Codename'
        required: true
        default: 'RMX3388'
      BUILD_TARGET:
        description: 'Target Image (vendorbootimage or recoveryimage)'
        required: true
        default: 'vendorbootimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
          libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python-is-python3

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          PATH="${HOME}/.bin:${PATH}"
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

      - name: Initialize Repo and Sync Source
        run: |
          mkdir -p ~/workdir
          cd ~/workdir
          PATH="${HOME}/.bin:${PATH}"
          repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      - name: Copy Device Tree to Workspace
        run: |
          mkdir -p ~/workdir/device/${{ github.event.inputs.DEVICE_VENDOR }}/${{ github.event.inputs.DEVICE_CODE }}
          cp -r $GITHUB_WORKSPACE/device/${{ github.event.inputs.DEVICE_VENDOR }}/${{ github.event.inputs.DEVICE_CODE }}/* ~/workdir/device/${{ github.event.inputs.DEVICE_VENDOR }}/${{ github.event.inputs.DEVICE_CODE }}/

      - name: Start Compilation
        run: |
          cd ~/workdir
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch fox_${{ github.event.inputs.DEVICE_CODE }}-eng || lunch omni_${{ github.event.inputs.DEVICE_CODE }}-eng
          mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc)

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-${{ github.event.inputs.DEVICE_CODE }}
          path: |
            ~/workdir/out/target/product/${{ github.event.inputs.DEVICE_CODE }}/*.img
            ~/workdir/out/target/product/${{ github.event.inputs.DEVICE_CODE }}/*.zip
